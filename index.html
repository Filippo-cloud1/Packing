<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Packing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — brand header, sticky day bar, big tap tiles per client, icon tab bar.
   Palette: night sky navy + canopy light-blue (from the icon); orange only for money owed. */
:root{
  --bg:#0b1a2e; --panel:#122640; --panel-2:#19324f; --line:#24405f;
  --fg:#eaf2fa; --muted:#8ea7c0; --accent:#2cc0e8; --accent-ink:#03202c; --accent-soft:rgba(44,192,232,.16);
  --warn:#ff8a4c; --ok:#4fd49a; --danger:#ff6b6b; --bar:#0e2036;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-skin="dark"]){
    --bg:#edf3f8; --panel:#ffffff; --panel-2:#e2ecf5; --line:#cddbe8;
    --fg:#0c2136; --muted:#567089; --accent:#0a8ec0; --accent-ink:#ffffff; --accent-soft:rgba(10,142,192,.12);
    --warn:#d4601c; --ok:#178a55; --danger:#c93636; --bar:#ffffff; color-scheme:light;
  }
}
:root[data-skin="light"]{
  --bg:#edf3f8; --panel:#ffffff; --panel-2:#e2ecf5; --line:#cddbe8;
  --fg:#0c2136; --muted:#567089; --accent:#0a8ec0; --accent-ink:#ffffff; --accent-soft:rgba(10,142,192,.12);
  --warn:#d4601c; --ok:#178a55; --danger:#c93636; --bar:#ffffff; color-scheme:light;
}

/* brand header */
.top{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 0;display:flex;align-items:center;gap:10px}
.top .logo{width:34px;height:34px;flex:none;border-radius:9px}
.top .brand{flex:1;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em}
.themebtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--fg)}
.themebtn svg{width:22px;height:22px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;display:flex;flex-direction:column;gap:16px}

/* day bar */
.daybar{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.navbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;flex:none}
.daylabel{flex:1;min-width:0;text-align:center}
.daylabel .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.daylabel .date{font-family:var(--display);font-weight:600;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daylabel input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

.totals{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.totals div{background:var(--panel);padding:12px 16px}
.totals .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.totals .v{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.totals .v.eur{color:var(--accent)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:14px}
.banner button{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

/* client tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;overflow:hidden;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:150px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);text-align:left;transition:transform .08s,background .25s,border-color .25s}
.tile:active{transform:scale(.97)}
.tile.bump{background:var(--accent-soft);border-color:var(--accent)}
.tile .name{font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere;padding-right:40px}
.tile .count{font-family:var(--display);font-weight:700;font-size:60px;line-height:.95;margin-top:auto;font-variant-numeric:tabular-nums;color:var(--accent)}
.tile.zero .count{color:var(--muted)}
.tile .sub{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .plus{position:absolute;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:28px;line-height:1}
.tile .fly{position:absolute;right:20px;bottom:60px;font-family:var(--display);font-weight:700;font-size:28px;color:var(--accent);pointer-events:none;animation:fly .7s ease-out forwards}
.tile .count.pop{animation:pop .3s ease-out}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.minus{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center}
.tile-wrap{position:relative;display:flex}
.addtile{min-height:118px;border-radius:14px;border:1px dashed var(--line);background:none;color:var(--muted);font-weight:600}

.cnote,.dnote{font-size:13px;line-height:1.3;color:var(--muted);padding-right:40px;overflow-wrap:anywhere}
.dnote{color:var(--accent);font-weight:500}
.clip1,.clip2{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.clip1{-webkit-line-clamp:1}.clip2{-webkit-line-clamp:2}
.tile .count{margin-top:auto;padding-top:6px}
.minus.notebtn{top:52px}
.minus.notebtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.note-in{min-height:0;font-family:var(--body);font-size:14px}
.crow{border-top:1px solid var(--line)}.crow:first-child{border-top:0}
.scrim{position:fixed;inset:0;background:rgba(3,10,20,.55);z-index:6}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet-h{display:flex;flex-direction:column;gap:2px;font-size:18px}
.sheet textarea{font-family:var(--body);font-size:16px;min-height:90px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:42px;height:42px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:3px}
.themebtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.small{padding:6px 10px;font-size:13px}
#methodForm{gap:10px}#methodForm input{flex:1;min-width:0}
.card>.switch:last-child{border-bottom:0}
:root{--tip:#f5c542;--gold:#f5c542;--silver:#c9d3dd;--bronze:#d08a52}
.rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--panel-2);color:var(--muted)}
.rk.r1{background:var(--gold);color:#3a2a00}.rk.r2{background:var(--silver);color:#1e2a36}.rk.r3{background:var(--bronze);color:#2e1500}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:16px 10px 0}
.pc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;text-align:center;color:var(--fg)}
.pc .nm{font-weight:600;font-size:14px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .eur{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.pc .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--panel-2);border:2px solid}
.pc .blk{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;color:#1d2530}
.pc.sel .av{box-shadow:0 0 0 3px var(--accent)}
.rrow{width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--fg);font:inherit}
.card>.rrow:first-child{border-top:0}
.rrow.sel{background:var(--accent-soft)}
.rrow .eur,.rdet .eur{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.rrow.sel+.rdet{background:var(--accent-soft);border-top:0;padding-top:0}
.rdet{padding:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);background:var(--panel)}
.card>.rdet:first-child{border-top:0}
.rdet .dh{display:flex;align-items:center;gap:10px}.rdet .g{flex:1;min-width:0}.rdet .nm{font-weight:600;font-size:16px}
.rdet .st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rdet .st div{background:var(--panel-2);border-radius:8px;padding:7px 6px;min-width:0}
.rdet .st b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.rdet .st span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.up{color:var(--ok);font-size:12px;font-weight:600}.dn{color:var(--warn);font-size:12px;font-weight:600}
.fold{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font:inherit}
.fold .fold-t{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fold .chev{flex:none;color:var(--accent);transition:transform .2s}
.fold[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fold[aria-expanded="true"]{border-color:var(--accent)}
.tipc{color:var(--tip)}
.tips .tipgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.tips .tipgrid div{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tips .tipgrid .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tips .tipgrid b{font-family:var(--display);font-size:24px;color:var(--tip);font-variant-numeric:tabular-nums}
.tips .tiptop{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 14px;font-size:14px;border-top:1px solid var(--line)}
.tips .tiptop span{display:inline-flex;align-items:center;gap:6px}
.tips .tiptop b{color:var(--tip)}
.tips>.actions{padding-top:12px!important;border-top:1px solid var(--line)}
select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit}
.pickbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 16px;border-radius:14px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font:inherit;font-size:17px;font-weight:600}
.picker{border-color:var(--accent)}
.res .grow{flex:1;min-width:0}
.pick-h{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.pick-h input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--fg)}
.pick-h input:focus{border-color:var(--accent);outline:none}
.picker .results{max-height:52vh;overflow-y:auto;overscroll-behavior:contain}
.searchwrap{position:relative;display:flex;flex-direction:column;gap:6px}
.searchwrap input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:17px;color:var(--fg)}
.searchwrap input:focus{border-color:var(--accent);outline:none}
.results{display:flex;flex-direction:column}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px;font-size:16px}
.res:first-child{border-top:0}
.res:active{background:var(--panel-2)}
.res.new{color:var(--accent);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:14px}

/* sections */
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.row .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row.total{background:var(--panel-2);font-weight:600}
.row.total .num{font-family:var(--display);font-size:22px;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.ghost{background:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:12px;padding:14px}
.form .two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.price-in{width:88px!important;text-align:right}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
.tabs .in{display:flex;width:100%;max-width:560px;padding-inline:4px}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:8px 2px 10px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.tabs button svg{width:26px;height:26px;padding:3px 12px;box-sizing:content-box;border-radius:999px;transition:background .2s}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"] svg{background:var(--accent-soft);color:var(--accent)}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px}
.calhead .m{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:22px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-block:4px}
.cal .d{position:relative;aspect-ratio:1/1.05;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-variant-numeric:tabular-nums;font-size:15px}
.cal .d.out{visibility:hidden}
.cal .d.plan{background:color-mix(in srgb,var(--accent) 22%,var(--panel));border-color:var(--accent)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:1px}
.cal .d .n{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel))}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block;color:var(--accent)}
.sw-n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--panel);font-style:normal;font-size:11px;font-weight:700;color:var(--ok)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.due{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ok)}
.pill.cred{background:var(--panel-2);color:var(--muted)}
.paybox{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px;border-top:1px dashed var(--line);padding-top:12px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:5;max-width:calc(100% - 32px)}
/* client rows (long bands) */
.tiles{grid-template-columns:1fr!important}
.tile{flex-direction:row!important;align-items:center!important;min-height:104px!important;padding:12px 140px 12px 16px!important;gap:12px!important}
.tile .tl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tile .tl .name{padding-right:0!important;font-size:19px}
.tile .tl .cnote,.tile .tl .dnote{padding-right:0!important}
.tile .tc{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.tile .count{margin-top:0!important;padding-top:0!important;font-size:52px!important;line-height:.9!important}
.tile .plus{top:50%;bottom:auto!important;right:14px!important;transform:translateY(-50%);width:58px!important;height:58px!important;font-size:32px!important}
.tile-wrap>.minus{right:84px!important;top:14px!important}
.tile-wrap>.minus.notebtn{top:auto!important;bottom:14px!important}
.tile .fly{right:150px!important;bottom:auto!important;top:8px!important}
.clip3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:3}
.tile .tl .cnote{font-size:15px!important;line-height:1.3!important;color:var(--fg)!important;opacity:.82;white-space:pre-line}
.tile .tl .dnote{font-size:15px!important;line-height:1.3!important;font-weight:600;white-space:pre-line}
.fixnote{background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.35;white-space:pre-wrap}
.fixnote .k{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tile{min-height:120px!important}
.tile-wrap>.minus{width:34px!important;height:34px!important;top:10px!important}
.tile-wrap>.minus.notebtn{top:50%!important;bottom:auto!important;transform:translateY(-50%)}
.tile-wrap>.minus.donebtn{top:auto!important;bottom:10px!important;color:var(--ok)}
.finrow{gap:10px}.finrow b{font-weight:600}
/* podium: sober metals, dark blocks with metal stripe */
:root{--gold:#c9a85a;--silver:#a3afbb;--bronze:#b5805d;--tip:var(--ok)}
.pc .blk{background:var(--panel-2)!important;border-top:5px solid;color:var(--fg)!important}

function tr(s){if(!isEN()||!s)return s;const k=s.replace(/\s+/g,' ').trim();const put=x=>s.includes(k)?s.replace(k,x):x;
  if(Object.prototype.hasOwnProperty.call(EN,k))return put(EN[k]);
  for(const [re,rep] of ENP){if(re.test(k))return put(k.replace(re,rep))}return s}

function translateDom(root){
  if(!isEN()||trBusy)return;trBusy=true;
  try{const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);let n;
    while(n=w.nextNode()){const p=n.parentNode;if(!p||p.nodeName==='SCRIPT'||p.nodeName==='STYLE'||p.nodeName==='TEXTAREA'||p.closest('[data-u]'))continue;
      const v=n.nodeValue;if(!v.trim())continue;const t=tr(v);if(t!==v)n.nodeValue=t}
    (root||document.body).querySelectorAll('[placeholder],[aria-label]').forEach(e=>{['placeholder','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v){const t=tr(v);if(t!==v)e.setAttribute(a,t)}})});
  }finally{trBusy=false}
}

function inRange(e){
  if(view.range==='day')return e.day===view.day;
  if(view.range==='all')return true;
  const d=parseDay(view.day),x=parseDay(e.day);
  if(view.range==='month')return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth();
  if(view.range==='week'){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));const s=new Date(m);s.setDate(m.getDate()+7);return x>=m&&x<s}
}
function summarize(list){
  const by={};list.forEach(e=>{const b=by[e.clientId]||(by[e.clientId]={n:0,tot:0});b.n++;b.tot+=e.price});
  const rows=Object.entries(by).map(([id,v])=>({name:(clientById(id)||{name:'Cliente eliminato'}).name,...v})).sort((a,b)=>b.n-a.n);
  return {rows,n:list.length,tot:list.reduce((s,e)=>s+e.price,0)};
}

  return ids.filter(id=>clientById(id));
}

function rankPeriod(kind,shift){
  const d=parseDay(view.day);
  if(kind==='month'){const x=new Date(d.getFullYear(),d.getMonth()+shift,1);return {key:x.getFullYear()+'-'+pad(x.getMonth()+1),label:x.toLocaleDateString(LOC(),{month:'long',year:'numeric'}),short:x.toLocaleDateString(LOC(),{month:'long'})}}
  if(kind==='year'){const y=d.getFullYear()+shift;return {key:String(y),label:String(y),short:String(y)}}
  return {key:'',label:'sempre',short:''};
}
function rankStats(key){
  const by={};
  S.entries.forEach(e=>{if(key&&!e.day.startsWith(key))return;const c=clientById(e.clientId);if(!c)return;
    const b=by[e.clientId]||(by[e.clientId]={id:e.clientId,name:c.name,n:0,tot:0,days:new Set()});b.n++;b.tot+=e.price;b.days.add(e.day)});
  return Object.values(by).sort((a,b)=>b.tot-a.tot||b.n-a.n);
}
function rankDetail(r,i,kind,inline){
  const prevKey=kind==='all'?null:rankPeriod(kind,-1).key;
  let trend='';
  if(prevKey!==null){const p=rankStats(prevKey).find(x=>x.id===r.id);const pl=rankPeriod(kind,-1).short;
    if(!p)trend=`<span class="up">▲ nuovo rispetto a ${pl}</span>`;
    else{const pct=Math.round((r.tot-p.tot)/p.tot*100);trend=pct>0?`<span class="up">▲ +${pct}% rispetto a ${pl}</span>`:pct<0?`<span class="dn">▼ ${pct}% rispetto a ${pl}</span>`:`<span class="muted small">= come ${pl}</span>`}}
  const due=Math.max(0,balance(r.id).due),days=r.days.size,c=clientById(r.id);
  return `<div class="rdet" id="rdet-${r.id}">
    ${inline?(trend?`<div>${trend}</div>`:''):`<div class="dh"><span class="rk r${i<3?i+1:''}">${i+1}</span><div class="g"><div class="nm">${esc(r.name)}</div>${trend}</div><div class="eur">${eur(r.tot)}</div>
      <button class="minus" style="position:static;flex:none" data-act="rankSel" data-id="${r.id}" aria-label="Chiudi dettaglio">×</button></div>`}
    <div class="st">
      <div><b>${r.n}</b><span>Ripieg.</span></div>
      <div><b>${days}</b><span>Giorni</span></div>
      <div><b>${(r.n/days).toLocaleString(LOC(),{maximumFractionDigits:1})}</b><span>Al giorno</span></div>
      <div><b style="${due?'color:var(--warn)':''}">${eur(due)}</b><span>Da pagare</span></div>
    </div>
    ${(()=>{const tp=tipsSum(p=>p.clientId===r.id);return tp?`<div class="small">Mance ricevute da questo cliente: <b class="tipc">${eur(tp)}</b></div>`:''})()}
    ${c&&c.note?`<div class="muted small" style="white-space:pre-wrap">${esc(c.note)}</div>`:''}
  </div>`;
}
function rankSection(){

  const total=list.reduce((a,r)=>a+r.tot,0),sel=view.rankSel;
  const med=['gold','silver','bronze'],h=[96,68,48];
  const pc=i=>{const r=list[i];if(!r)return `<div class="pc"></div>`;
    return `<button class="pc ${sel===r.id?'sel':''}" data-act="rankSel" data-id="${r.id}" aria-label="Dettagli di ${esc(r.name)}">

      <span class="nm">${esc(r.name)}</span><span class="eur">${eur(r.tot)}</span>

  const podium=`<div class="card"><div class="pod">${pc(1)}${pc(0)}${pc(2)}</div></div>`;

  <div class="card">${rest}<div class="row total"><span class="grow">Totale ${kind==='all'?'':per.label} · ${list.reduce((a,r)=>a+r.n,0)} ripiegamenti</span><span class="num">${eur(total)}</span></div></div>
  <p class="muted small" style="margin:0">Tocca un cliente per vedere i dettagli.</p>`;
}

function monthChart(){
  if(!S.entries.length)return '';
  const now=new Date(),months=[];
  const first=S.entries.reduce((m,e)=>e.day<m?e.day:m,today()).slice(0,7);
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.getFullYear()+'-'+pad(d.getMonth()+1);if(k>=first)months.push({k,d})}
  months.forEach(m=>{const es=S.entries.filter(e=>e.day.startsWith(m.k));m.n=es.length;m.tot=es.reduce((s,e)=>s+e.price,0);
    m.paid=S.payments.filter(p=>p.day.startsWith(m.k)).reduce((s,p)=>s+p.amount,0)});
  const max=Math.max(...months.map(m=>m.tot),1);
  const W=360,H=190,top=22,bottom=24,ch=H-top-bottom,slot=W/Math.max(months.length,6),bw=Math.min(36,slot*0.62);
  const bars=months.map((m,i)=>{const x=i*slot+(slot-bw)/2,h=Math.max(m.tot/max*ch,m.tot?3:1),y=top+ch-h;
    const lab=m.d.toLocaleDateString(LOC(),{month:'short'}).replace('.','');
    return `<g data-act="monthPick" data-k="${m.k}" style="cursor:pointer"><rect x="${i*slot}" y="0" width="${slot}" height="${H}" fill="transparent"></rect>
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${m.tot?'var(--accent)':'var(--line)'}" ${i===months.length-1?'':'fill-opacity="0.8"'}></rect>
      ${m.tot?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--fg)" style="font-variant-numeric:tabular-nums">${Math.round(m.tot)}</text>`:''}
      <text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text></g>`}).join('');
  const cur=months[months.length-1],prev=months[months.length-2];
  return `<h2>Guadagni per mese</h2>
  <div class="card" style="padding:14px 12px 6px">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Guadagni in euro per mese" style="display:block;font-family:var(--body)">
      <line x1="0" x2="${W}" y1="${top+ch}" y2="${top+ch}" stroke="var(--line)"></line>${bars}</svg>
  </div>
  <div class="card">
    <div class="row"><span class="grow">Questo mese · ${cur.n} ripiegamenti</span><span class="num">${eur(cur.tot)}</span></div>
    <div class="row"><span class="grow muted">Incassato questo mese</span><span class="num muted">${eur(cur.paid)}</span></div>
    ${tipsSum(p=>p.day.startsWith(cur.k))?`<div class="row"><span class="grow muted">di cui mance</span><span class="num tipc">${eur(tipsSum(p=>p.day.startsWith(cur.k)))}</span></div>`:''}
    ${prev?`<div class="row"><span class="grow muted">Mese scorso · ${prev.n} ripiegamenti</span><span class="num muted">${eur(prev.tot)}</span></div>`:''}
  </div>
  <p class="muted small" style="margin:0">Importi in euro del lavoro fatto. Tocca un mese per vederne i totali per cliente.</p>`;
}
function renderRiep(){

    <div class="row total"><span class="grow">Totale · ${sum.n} ripiegamenti</span><span class="num">${eur(sum.tot)}</span></div></div>
    <div class="actions"><button class="btn" data-act="copySum">Copia riepilogo</button></div>`

    ${open?`<p class="muted small" style="margin:0">Per un caso particolare cambia il prezzo del singolo ripiegamento.</p><div class="card">${items}</div>`:''}`;
  }
  const dn=view.range==='day'?Object.entries(S.dayNotes[view.day]||{}).filter(([id])=>clientById(id)):[];

const compact=k=>k.replace(/-/g,'');
function nextDay(k){const d=parseDay(k);d.setDate(d.getDate()+1);return dayKey(d)}
function gcalLink(k){
  const note=S.planned[k]||'';
  const p=new URLSearchParams({action:'TEMPLATE',text:(isEN()?'Parachute packing':'Ripiegamenti')+(note?' – '+note:''),dates:compact(k)+'/'+compact(nextDay(k)),details:isEN()?'Working day marked in Packing':'Giornata di lavoro segnata in Packing'});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function icsText(keys){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=keys.map(k=>['BEGIN:VEVENT','UID:packing-'+k+'@packing','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+compact(k),'DTEND;VALUE=DATE:'+compact(nextDay(k)),'SUMMARY:'+(isEN()?'Parachute packing':'Ripiegamenti')+(S.planned[k]?' - '+S.planned[k].replace(/[,;\n]/g,' '):''),'END:VEVENT'].join('\r\n'));
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Packing//IT',...ev,'END:VCALENDAR'].join('\r\n');
}

function renderCal(){
  const [y,m]=view.calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  const counts={};S.entries.forEach(e=>{if(e.day.startsWith(view.calMonth))counts[e.day]=(counts[e.day]||0)+1});
  const t=today();
  let cells=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++)cells+=`<div class="d out"></div>`;
  for(let d=1;d<=days;d++){const k=view.calMonth+'-'+pad(d);
    cells+=`<button class="d ${k in S.planned?'plan':''} ${k===t?'today':''} ${k===view.calSel?'sel':''}" data-act="calPick" data-k="${k}" aria-label="${fmtDay(k)}">${d}${counts[k]?`<span class="n">${counts[k]}</span>`:''}</button>`}
  const k=view.calSel,planned=k in S.planned,n=S.entries.filter(e=>e.day===k).length;
  const upcoming=Object.keys(S.planned).filter(x=>x>=t).sort();
  const monthName=first.toLocaleDateString(LOC(),{month:'long',year:'numeric'});
  return `<div class="calhead"><button class="navbtn" data-act="calPrev" aria-label="Mese precedente">‹</button><div class="m">${monthName}</div><button class="navbtn" data-act="calNext" aria-label="Mese successivo">›</button></div>
  <div class="cal">${cells}</div>
  <div class="legend"><span><i class="sw"></i>Giorno di lavoro segnato</span></div>
  <div class="muted small">${(()=>{const n=Object.values(counts).reduce((a,b)=>a+b,0);return n?`In ${monthName}: <b style="color:var(--fg)">${n} ripiegamenti</b> in ${Object.keys(counts).length} giorni`:`In ${monthName} non hai ancora segnato ripiegamenti.`})()}</div>
  <div class="card">
    <label class="switch"><span><b>${fmtDay(k)}</b><br><span class="muted small">${n?n+' ripiegamenti segnati':'Nessun ripiegamento segnato'}</span></span>
      <input type="checkbox" id="planToggle" ${planned?'checked':''} aria-label="Giorno di lavoro"></label>
    ${planned?`<div class="form"><label class="f">Nota (posto, cliente, orario)<input type="text" id="planNote" value="${esc(S.planned[k])}" placeholder="Es. Aviosuperficie, dalle 9"></label>
      <div class="actions"><a class="btn" href="${gcalLink(k)}" target="_blank" rel="noopener">Aggiungi a Google Calendar</a></div></div>`:''}
    ${k<=t?`<div class="form" style="padding-top:${planned?0:14}px"><div class="actions"><button class="btn primary" data-act="calGo">Apri il contatore di questo giorno</button></div></div>`:''}
  </div>
  <h2>Prossimi giorni di lavoro</h2>
  ${upcoming.length?`<div class="card">${upcoming.map(x=>`<div class="row"><span class="grow">${fmtDay(x)}${S.planned[x]?`<br><span class="muted small">${esc(S.planned[x])}</span>`:''}</span><a class="btn ghost small" href="${gcalLink(x)}" target="_blank" rel="noopener">+ Calendario</a></div>`).join('')}</div>
  <div class="actions"><button class="btn" data-act="icsAll">Esporta tutti (.ics)</button></div>
  <p class="muted small" style="margin:0">Il file .ics si apre con il calendario del telefono (Google, Samsung o iPhone) e aggiunge tutti i giorni in un colpo. Funziona nella versione installata sul telefono.</p>`
  :`<div class="empty">Tocca un giorno sul calendario e attiva "Giorno di lavoro".</div>`}`;
}

function balance(cid){
  const owed=S.entries.filter(e=>e.clientId===cid).reduce((s,e)=>s+e.price,0);
  const paid=S.payments.filter(p=>p.clientId===cid).reduce((s,p)=>s+p.amount-(p.tip||0),0);
  return {owed,paid,due:Math.round((owed-paid)*100)/100};
}
function tipsSum(pred){return S.payments.filter(p=>p.tip&&pred(p)).reduce((a,p)=>a+p.tip,0)}
function tipsSection(){
  const t=today(),m=t.slice(0,7),y=t.slice(0,4);
  const mm=tipsSum(p=>p.day.startsWith(m)),yy=tipsSum(p=>p.day.startsWith(y)),all=tipsSum(()=>true);
  const by={};S.payments.forEach(p=>{if(p.tip&&clientById(p.clientId))by[p.clientId]=(by[p.clientId]||0)+p.tip});
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const opts=[...S.clients].sort((a,b)=>a.name.localeCompare(b.name,isEN()?'en':'it')).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const form=view.tipOpen?`<div class="form" style="border-top:1px solid var(--line)">
      <div class="two"><label class="f">Cliente<select id="tipClient"><option value="">Scegli…</option>${opts}</select></label>
      <label class="f">Mancia €<input type="number" id="tipAmount" step="0.5" min="0"></label></div>
      <div class="seg">${cfg().methods.map(x=>`<button data-act="payMethod" data-m="${esc(x)}" aria-pressed="${view.payMethod===x}">${esc(tm(x))}</button>`).join('')}</div>
      <div class="actions"><button class="btn primary" data-act="tipDo">Registra mancia</button><button class="btn ghost" data-act="tipClose">Annulla</button></div></div>`:'';
  return `<h2>Mance</h2>
  <div class="card tips">
    <div class="tipgrid"><div><span class="k">Questo mese</span><b>${eur(mm)}</b></div><div><span class="k">Quest'anno</span><b>${eur(yy)}</b></div><div><span class="k">In totale</span><b>${eur(all)}</b></div></div>
    ${top.length?`<div class="tiptop">${top.map(([id,v],i)=>`<span><i class="rk r${i+1}" style="width:20px;height:20px;font-size:11px;display:inline-grid">${i+1}</i>${esc(clientById(id).name)} <b>${eur(v)}</b></span>`).join('')}</div>`:''}
    ${view.tipOpen?form:`<div style="padding:0 14px 14px" class="actions"><button class="btn" data-act="tipOpen" ${S.clients.length?'':'disabled'}>+ Mancia senza pagamento</button></div>`}
  </div>`;
}

function renderPag(){
  const list=S.clients.map(c=>({c,...balance(c.id)})).filter(x=>x.due>0).sort((a,b)=>b.due-a.due);
  const totDue=list.reduce((s,x)=>s+Math.max(0,x.due),0);
  const debtors=list.filter(x=>x.due>0).length;
  const rows=list.map(({c,owed,paid,due})=>{
    const pill=due>0?`<span class="pill due">Deve ${eur(due)}</span>`:due<0?`<span class="pill cred">Anticipo ${eur(-due)}</span>`:`<span class="pill ok">In pari</span>`;
    const open=view.payFor===c.id;
    return `<div><div class="row"><span class="grow">${esc(c.name)}<br><span class="muted small">Lavoro ${eur(owed)} · Pagato ${eur(paid)}</span></span>${pill}</div>
    ${open?`<div class="paybox">
      <div class="two"><label class="f">Importo ricevuto €<input type="number" id="payAmount" data-due="${due}" step="0.5" min="0" value="${due>0?due:''}"></label>
      <label class="f">di cui mancia €<input type="number" id="payTip" step="0.5" min="0" value="0"></label></div>
      <span class="muted small" id="payHint">Se ricevi più di ${eur(due)}, la differenza va nelle mance. Se era un anticipo, metti 0.</span>
      <div class="seg">${cfg().methods.map(m=>`<button data-act="payMethod" data-m="${m}" aria-pressed="${view.payMethod===m}">${esc(tm(m))}</button>`).join('')}</div>
      <div class="actions"><button class="btn primary" data-act="payDo" data-id="${c.id}">Registra pagamento</button><button class="btn ghost" data-act="payClose">Annulla</button></div>
    </div>`:`<div style="padding:0 14px 12px" class="actions"><button class="btn" data-act="payOpen" data-id="${c.id}">+ Pagamento</button></div>`}</div>`}).join('<div style="border-top:1px solid var(--line)"></div>');
  const hist=[...S.payments].sort((a,b)=>b.ts-a.ts).slice(0,30).map(p=>{const c=clientById(p.clientId);
    return `<div class="row"><span class="grow">${esc(c?c.name:'Cliente eliminato')}<br><span class="muted small">${fmtDay(p.day)} · ${esc(tm(p.method))}${p.tip?` · <span class="tipc">${p.tip===p.amount?'mancia':'di cui mancia '+eur(p.tip)}</span>`:''}</span></span><span class="num">${eur(p.amount)}</span>
    <button class="minus" style="position:static;flex:none" data-act="delPay" data-id="${p.id}" aria-label="Elimina pagamento">×</button></div>`}).join('');
  return `<div class="totals"><div><div class="k">Da incassare</div><div class="v eur">${eur(totDue)}</div></div><div><div class="k">Clienti in debito</div><div class="v">${debtors}</div></div></div>
  <h2>Lista nera</h2>
  <p class="muted small" style="margin:0">Il saldo considera tutti i ripiegamenti segnati meno i pagamenti ricevuti.</p>
  ${list.length?`<div class="card">${rows}</div>`:`<div class="empty">Nessuno ti deve soldi. Tutti i clienti sono in pari.</div>`}
  ${tipsSection()}
  ${hist?(()=>{const n=Math.min(S.payments.length,30),open=!!view.payHistOpen,tot=S.payments.reduce((a,p)=>a+p.amount,0);
    return `<button class="fold" data-act="togglePayHist" aria-expanded="${open}"><span class="grow"><span class="fold-t">Ultimi pagamenti</span><br><span class="muted small">${S.payments.length} ${S.payments.length===1?'pagamento':'pagamenti'} · ${eur(tot)} incassati in totale</span></span><svg class="chev" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    ${open?`<div class="card">${hist}</div>${S.payments.length>n?`<p class="muted small" style="margin:0">Mostrati gli ultimi ${n}.</p>`:''}`:''}`})()
  :`<h2>Ultimi pagamenti</h2><div class="empty">Nessun pagamento registrato.</div>`}`;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=view.tab==='conta'?renderConta():view.tab==='riep'?renderRiep():view.tab==='cal'?renderCal():view.tab==='pag'?renderPag():view.tab==='set'?renderSet():renderCli();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===view.tab));
  const sb=document.getElementById('setBtn');if(sb)sb.classList.toggle('on',view.tab==='set');
  if(view.adding){const i=document.getElementById('newName');i&&i.focus()}
}

function shiftDay(n){const d=parseDay(view.day);d.setDate(d.getDate()+n);const k=dayKey(d);if(k>today())return;view.day=k;render()}
function copy(text,msg){
  const done=()=>toast(msg);
  try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){toast('Copia non riuscita')}t.remove()}
}
function summaryText(){
  const list=S.entries.filter(inRange),s=summarize(list);
  const E=isEN(),label={day:fmtDay(view.day),week:(E?'Week of ':'Settimana del ')+fmtDay(view.day),month:parseDay(view.day).toLocaleDateString(LOC(),{month:'long',year:'numeric'}),all:E?'All time':'Totale complessivo'}[view.range];
  return `${E?'Packs':'Ripiegamenti'}${cfg().name?(E?' by ':' di ')+cfg().name:''} – ${label}\n`+s.rows.map(r=>`${r.name}: ${r.n} × = ${eur(r.tot)}`).join('\n')+`\n${E?'TOTAL':'TOTALE'}: ${s.n} ${E?'packs':'ripiegamenti'} = ${eur(s.tot)}`;
}

document.addEventListener('click',ev=>{
  if(ev.target.closest('#themeBtn')){const order=['auto','light','dark'];S.theme=order[(order.indexOf(S.theme||'auto')+1)%3];save();applySkin();
    toast({auto:'Aspetto automatico, come il telefono',light:'Aspetto chiaro, per il sole',dark:'Aspetto scuro'}[S.theme]);if(view.tab==='set')render();return}
  if(ev.target.closest('#setBtn')){view.tab='set';view.adding=false;view.confirm=null;view.confirmWipe=false;view.confirmPrice=false;render();window.scrollTo(0,0);return}
  const tab=ev.target.closest('.tabs button');if(tab){view.pickOpen=false;view.tab=tab.dataset.tab;view.adding=false;view.confirm=null;render();return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'prev':shiftDay(-1);break;
    case 'next':shiftDay(1);break;
    case 'today':view.day=today();render();break;
    case 'plus':{const c=clientById(id);const now=new Date();
      if(cfg().guard){const last=S.entries.filter(e=>e.clientId===id&&e.day===view.day).reduce((m,e)=>Math.max(m,e.created||0),0);if(Date.now()-last<1500){toast('Doppio tocco ignorato');break}}const ts=view.day===today()?now.getTime():parseDay(view.day).setHours(12,0,0,0);
      S.entries.push({id:uid(),clientId:id,day:view.day,ts,price:c.price,created:Date.now()});save();render();
      const t=document.getElementById('tile-'+id);if(t){t.classList.add('bump');setTimeout(()=>t.classList.remove('bump'),260);
        const cn=t.querySelector('.count');cn&&cn.classList.add('pop');
        const f=document.createElement('span');f.className='fly';f.textContent='+1';t.appendChild(f);setTimeout(()=>f.remove(),750)}
      if(cfg().vibrate){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}break}
    case 'minus':{const l=S.entries.filter(e=>e.clientId===id&&e.day===view.day).sort((a,b)=>b.ts-a.ts)[0];
      if(l){S.entries=S.entries.filter(e=>e!==l);save();render();toast('Tolto 1 ripiegamento')}break}
    case 'clearSample':S={clients:[],entries:[],planned:{},payments:[],dayClients:{},dayNotes:{},dayDone:{},set:S.set,theme:S.theme};save();view.adding=true;render();break;
    case 'addOpen':view.adding=true;render();break;
    case 'addClose':view.adding=false;render();break;
    case 'range':view.range=b.dataset.r;render();break;
    case 'copySum':copy(summaryText(),'Riepilogo copiato');break;
    case 'delEntry':S.entries=S.entries.filter(e=>e.id!==id);save();render();break;
    case 'askDel':view.confirm=id;render();break;
    case 'cancelDel':view.confirm=null;render();break;
    case 'delCli':S.clients=S.clients.filter(c=>c.id!==id);S.entries=S.entries.filter(e=>e.clientId!==id);S.payments=S.payments.filter(p=>p.clientId!==id);view.confirm=null;save();render();break;
    case 'calPrev':case 'calNext':{const[y,m]=view.calMonth.split('-').map(Number);const d=new Date(y,m-1+(a==='calNext'?1:-1),1);view.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
    case 'monthPick':{const[y,m]=b.dataset.k.split('-').map(Number);const last=dayKey(new Date(y,m,0));view.day=last>today()?today():last;view.range='month';render();window.scrollTo({top:0,behavior:'smooth'});break}
    case 'noteOpen':view.noteFor=id;render();{const t=document.getElementById('dayNoteBox');t&&t.focus()}break;
    case 'noteClose':view.noteFor=null;render();break;
    case 'noteSave':setDayNote(view.day,view.noteFor,document.getElementById('dayNoteBox').value.trim());view.noteFor=null;save();render();toast('Nota salvata');break;
    case 'noteClear':setDayNote(view.day,view.noteFor,'');view.noteFor=null;save();render();break;
    case 'setLang':S.set.lang=b.dataset.v;document.documentElement.lang=S.set.lang;save();render();toast(S.set.lang==='en'?'Language: English':'Lingua: italiano');break;
    case 'setTheme':S.theme=b.dataset.v;save();applySkin();render();break;
    case 'setAccent':S.set.accent=b.dataset.v;save();applySkin();render();break;
    case 'setBackupDays':S.set.backupDays=Number(b.dataset.v);save();render();break;
    case 'defMethod':S.set.defMethod=S.set.methods[Number(b.dataset.i)];save();render();break;
    case 'delMethod':{if(S.set.methods.length<2)break;const m=S.set.methods[Number(b.dataset.i)];S.set.methods=S.set.methods.filter((x,i)=>i!==Number(b.dataset.i));
      if(S.set.defMethod===m)S.set.defMethod=S.set.methods[0];save();render();toast(m+' tolto');break}
    case 'priceAllAsk':view.confirmPrice=true;render();break;
    case 'priceAllNo':view.confirmPrice=false;render();break;
    case 'priceAllDo':S.clients.forEach(c=>c.price=S.set.price);view.confirmPrice=false;save();render();toast('Prezzo aggiornato per tutti');break;
    case 'wipeAsk':view.confirmWipe=true;render();break;
    case 'wipeNo':view.confirmWipe=false;render();break;
    case 'wipeDo':S={clients:[],entries:[],planned:{},payments:[],dayClients:{},dayNotes:{},dayDone:{},set:S.set,theme:S.theme};view.confirmWipe=false;save();render();toast('Dati cancellati');break;
    case 'togglePayHist':view.payHistOpen=!view.payHistOpen;render();break;
    case 'toggleDetail':view.detailOpen=!view.detailOpen;render();break;
    case 'rankKind':view.rankKind=b.dataset.v;view.rankSel=null;render();break;
    case 'rankSel':{view.rankSel=view.rankSel===id?null:id;render();if(view.rankSel){const el=document.getElementById('rdet-'+id);el&&el.scrollIntoView({behavior:'smooth',block:'nearest'})}break}
    case 'shareBackup':shareBackup();break;
    case 'saveBackup':downloadBackup();break;
    case 'doneOn':{const l=S.dayDone[view.day]||(S.dayDone[view.day]=[]);if(!l.includes(id))l.push(id);save();const c=clientById(id);render();toast((c?c.name:'')+' spostato tra i finiti');break}
    case 'doneOff':{S.dayDone[view.day]=(S.dayDone[view.day]||[]).filter(x=>x!==id);save();const c=clientById(id);render();toast((c?c.name:'')+' riaperto');break}
    case 'pickOpen':view.pickOpen=true;view.pickQ='';render();break;
    case 'pickClose':view.pickOpen=false;view.pickQ='';render();break;
    case 'dayAdd':{const l=S.dayClients[view.day]||(S.dayClients[view.day]=[]);if(!l.includes(id))l.push(id);save();const c=clientById(id);render();toast((c?c.name:'Cliente')+' aggiunto');break}
    case 'dayRemove':{S.dayClients[view.day]=(S.dayClients[view.day]||[]).filter(x=>x!==id);S.dayDone[view.day]=(S.dayDone[view.day]||[]).filter(x=>x!==id);save();render();break}
    case 'createFromSearch':{const name=(document.getElementById('search').value||'').trim();if(!name)break;view.pickQ='';
      if(S.sample)S={clients:[],entries:[],planned:S.planned,payments:[],dayClients:{},dayNotes:{},dayDone:{},set:S.set,theme:S.theme};
      const c={id:uid(),name,price:cfg().price};S.clients.push(c);(S.dayClients[view.day]||(S.dayClients[view.day]=[])).push(c.id);save();render();toast(name+' aggiunto');break}
    case 'payOpen':view.payFor=id;view.payMethod=cfg().methods.includes(view.payMethod)?view.payMethod:(cfg().methods.includes(cfg().defMethod)?cfg().defMethod:cfg().methods[0]);render();const pa=document.getElementById('payAmount');pa&&pa.focus();break;
    case 'payClose':view.payFor=null;render();break;
    case 'payMethod':view.payMethod=b.dataset.m;document.querySelectorAll('[data-act="payMethod"]').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'payDo':{const v=parseFloat(document.getElementById('payAmount').value);if(isNaN(v)||v<=0){toast('Inserisci un importo');break}
      let tip=parseFloat(document.getElementById('payTip').value);tip=isNaN(tip)||tip<0?0:Math.min(tip,v);
      S.payments.push({id:uid(),clientId:id,day:today(),ts:Date.now(),amount:v,tip,method:view.payMethod||cfg().defMethod});
      let moved=false;if(balance(id).due<=0&&dayIds(today()).includes(id)){const l=S.dayDone[today()]||(S.dayDone[today()]=[]);if(!l.includes(id)){l.push(id);moved=true}}
      save();view.payFor=null;render();
      toast(moved?'Saldato: spostato tra i finiti di oggi':(tip?`Pagamento registrato, mancia ${eur(tip)}`:'Pagamento registrato'));break}
    case 'tipOpen':view.tipOpen=true;view.payMethod=cfg().methods.includes(cfg().defMethod)?cfg().defMethod:cfg().methods[0];render();break;
    case 'tipClose':view.tipOpen=false;render();break;
    case 'tipDo':{const cid=document.getElementById('tipClient').value,v=parseFloat(document.getElementById('tipAmount').value);
      if(!cid){toast('Scegli il cliente');break}if(isNaN(v)||v<=0){toast('Inserisci un importo');break}
      S.payments.push({id:uid(),clientId:cid,day:today(),ts:Date.now(),amount:v,tip:v,method:view.payMethod||cfg().defMethod});view.tipOpen=false;save();render();toast('Mancia registrata: '+eur(v));break}
    case 'delPay':S.payments=S.payments.filter(p=>p.id!==id);save();render();break;
    case 'calPick':view.calSel=b.dataset.k;render();break;
    case 'calGo':view.day=view.calSel;view.tab='conta';render();break;
    case 'icsAll':{const keys=Object.keys(S.planned).filter(x=>x>=today()).sort();
      try{const url=URL.createObjectURL(new Blob([icsText(keys)],{type:'text/calendar'}));const l=document.createElement('a');l.href=url;l.download='packing-giorni.ics';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('File calendario creato')}catch(e){toast('Esportazione non disponibile qui')}break}
    case 'exportData':copy(JSON.stringify({clients:S.clients,entries:S.entries,planned:S.planned,payments:S.payments,dayClients:S.dayClients,dayNotes:S.dayNotes,dayDone:S.dayDone,set:S.set,theme:S.theme}),'Backup copiato');break;
    case 'importOpen':view.importOpen=true;render();break;
    case 'importClose':view.importOpen=false;render();break;
    case 'importDo':{try{const d=JSON.parse(document.getElementById('importBox').value);if(!Array.isArray(d.clients)||!Array.isArray(d.entries))throw 0;
      S={clients:d.clients,entries:d.entries,planned:d.planned||{},payments:d.payments||[],dayClients:d.dayClients||{},dayNotes:d.dayNotes||{},dayDone:d.dayDone||{},set:Object.assign({},SET_DEFAULTS,d.set||S.set),theme:d.theme||S.theme};save();view.importOpen=false;render();toast('Backup ripristinato')}catch(e){toast('Testo non valido: incolla il backup completo')}break}
  }
});
document.addEventListener('input',ev=>{if(ev.target.id==='search')openResults();
  if(ev.target.id==='payAmount'){const v=parseFloat(ev.target.value),due=parseFloat(ev.target.dataset.due)||0,t=document.getElementById('payTip');
    if(t&&!isNaN(v))t.value=Math.max(0,Math.round((v-Math.max(due,0))*100)/100)}});
document.addEventListener('keydown',ev=>{if(ev.target.id==='search'&&ev.key==='Enter'){ev.target.blur()}});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='methodForm'){ev.preventDefault();const v=document.getElementById('newMethod').value.trim();
    if(!v)return;if(S.set.methods.some(m=>m.toLowerCase()===v.toLowerCase())){toast(v+' c\'è già');return}
    S.set.methods=[...S.set.methods,v];save();render();toast(v+' aggiunto');return}
  if(ev.target.id!=='addForm')return;ev.preventDefault();
  const name=document.getElementById('newName').value.trim();if(!name)return;
  const p=parseFloat(document.getElementById('newPrice').value);
  if(S.sample){S={clients:[],entries:[],planned:{},payments:[],dayClients:{},dayNotes:{},dayDone:{},set:S.set,theme:S.theme}}
  S.clients.push({id:uid(),name,price:isNaN(p)?cfg().price:p});save();view.adding=false;render();toast(name+' aggiunto');
});
document.addEventListener('change',ev=>{
  const t=ev.target,v=parseFloat(t.value);
  if(t.dataset.price){const e=S.entries.find(x=>x.id===t.dataset.price);if(e&&!isNaN(v)){e.price=v;save();render()}}
  if(t.dataset.cprice){const c=clientById(t.dataset.cprice);if(c&&!isNaN(v)){c.price=v;save();toast('Prezzo aggiornato')}}
  if(t.id==='importFile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{applyImport(JSON.parse(r.result))}catch(e){toast('File non valido: scegli un backup di Packing')}};r.readAsText(t.files[0]);return}
  if(t.id==='planToggle'){if(t.checked)S.planned[view.calSel]=S.planned[view.calSel]||'';else delete S.planned[view.calSel];save();render();return}
  if(t.id==='planNote'){S.planned[view.calSel]=t.value.trim();save();render();return}
  if(t.dataset.set==='name'){S.set.name=t.value.trim();save();toast('Nome salvato');return}
  if(t.dataset.set==='price'){const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){S.set.price=v;save();render();toast('Prezzo standard: '+eur(v))}return}
  if(t.dataset.toggle){S.set[t.dataset.toggle]=t.checked;save();return}
  if(t.dataset.cnote){const c=clientById(t.dataset.cnote);if(c){c.note=t.value.trim();save();toast('Nota salvata')}return}
  if(t.dataset.name){const c=clientById(t.dataset.name);const n=t.value.trim();if(c&&n){c.name=n;save()}}
});
document.documentElement.lang=cfg().lang||'it';
applySkin();
render();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
